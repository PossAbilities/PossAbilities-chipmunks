name: Deploy Chipmunks to VPS

# Push to main = live. Ships the committed code to the Hetzner VPS and rebuilds
# the app container. The SQLite data volume and /opt/chipmunks/.env are untouched.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger a deploy by hand from the Actions tab

concurrency:
  group: deploy-chipmunks
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up SSH to the VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship code to the VPS
        run: |
          tar --exclude=node_modules --exclude=.next --exclude=.git -czf /tmp/app.tar.gz .
          scp -i ~/.ssh/deploy_key /tmp/app.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/app.tar.gz"

      - name: Rebuild and restart on the VPS
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "rm -rf /opt/chipmunks/app && mkdir -p /opt/chipmunks/app && tar xzf /root/app.tar.gz -C /opt/chipmunks/app && cd /opt/chipmunks && docker compose build chipmunks && docker compose up -d chipmunks && docker compose ps"
